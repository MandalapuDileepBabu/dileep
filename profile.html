<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civic Review Portal - Profile</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <nav class="gradient-bg text-white">
        <div class="container">
            <h1 class="text-xl font-bold">Civic Review Portal</h1>
            <div class="flex flex-col md:flex-row gap-2 items-center">
                <a href="main.html">Dashboard</a>
                <a href="submitfeedback.html">Submit Feedback</a>
                <a href="leaderboard.html">Leaderboard</a>
                <a href="#" onclick="logout()">Logout</a>
                <a href="profile.html" class="profile-circle" title="Profile">
                    <img src="profile.jpeg" alt="Profile Icon">
                </a>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="profile-container">
            <h2>User Profile</h2>
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="Enter your name" oninput="updateProfile()">
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter your email" oninput="updateProfile()">
            </div>
            <div class="form-group">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" placeholder="Enter your phone number" oninput="updateProfile()">
            </div>
            <div class="form-group">
                <label for="address">Address:</label>
                <input type="text" id="address" placeholder="Enter your address" oninput="updateProfile()">
            </div>
            <div class="form-group">
                <label for="photo">Profile Photo:</label>
                <input type="file" id="photo" accept="image/*" onchange="updateProfile()">
            </div>

            <div class="profile-display" id="profileDisplay">
                <h3>Profile Details</h3>
                <img id="displayPhoto" class="profile-photo" src="https://via.placeholder.com/100" alt="Profile Photo">
                <p><strong>Name:</strong> <span id="displayName">Not provided</span></p>
                <p><strong>Email:</strong> <span id="displayEmail">Not provided</span></p>
                <p><strong>Phone:</strong> <span id="displayPhone">Not provided</span></p>
                <p><strong>Address:</strong> <span id="displayAddress">Not provided</span></p>
            </div>
        </div>
    </div>

    <script>
        function updateProfile() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const photoInput = document.getElementById('photo');

            document.getElementById('displayName').textContent = name || 'Not provided';
            document.getElementById('displayEmail').textContent = email || 'Not provided';
            document.getElementById('displayPhone').textContent = phone || 'Not provided';
            document.getElementById('displayAddress').textContent = address || 'Not provided';

            if (photoInput.files && photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('displayPhoto').src = e.target.result;
                };
                reader.readAsDataURL(photoInput.files[0]);
            }
        }
    </script>
</body>
</html>
