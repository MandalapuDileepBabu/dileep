<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Civic Review</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="signup.js"></script>
</head>
<body>
  <div class="container">
    <h1>Create Account</h1>

    <form class="signup-form" onsubmit="handleSignup(event)">
      <input id="signup-email" type="email" placeholder="Email Address" required />
      <input id="signup-password" type="password" placeholder="Password" required />
      <select id="country" onchange="updateMobilePlaceholder()" required>
      <option value="">Loading countries...</option>
      </select>
      <input id="mobile" type="tel" placeholder="Mobile Number" required />
      <button type="submit">Sign Up</button>
      <a href="login.html">Already have an account? Login</a>
    </form>
  </div>
