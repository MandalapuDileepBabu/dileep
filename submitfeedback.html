<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Civic Review Portal - Submit Feedback</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="script.js"></script>
</head>
<body>
  <nav class="gradient-bg text-white">
    <div class="container">
      <h1 class="text-xl font-bold">Civic Review Portal</h1>
      <div class="flex flex-col md:flex-row gap-2">
        <a href="main.html">Dashboard</a>
        <a href="submitfeedback.html">Submit Feedback</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="#" onclick="logout()">Logout</a>
      </div>
    </div>
  </nav>
  <div class="container">
    <div class="card">
      <h2>Submit Feedback</h2>
      <form onsubmit="saveFeedback(event)">
        <label for="service">Service</label>
        <select id="service" required>
          <option value="">Select Service</option>
          <option value="Sanitation">Sanitation</option>
          <option value="Electricity">Electricity</option>
          <option value="Water">Water</option>
        </select>
        <label for="rating">Rating</label>
        <select id="rating" required>
          <option value="">Select Rating</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
        <label for="comment">Comment</label>
        <textarea id="comment" placeholder="Your feedback..." required></textarea>
        <label for="location">Location</label>
        <input id="location" type="text" placeholder="Enter location" required />
        <button type="submit">Submit</button>
      </form>
    </div>
  </div>
</body>
</html>
